# Emuladores locais do GCP.
#
# Ideia central do projeto: o codigo Python usa os SDKs OFICIAIS do Google
# (google-cloud-storage, google-cloud-pubsub). Quem decide se ele fala com o
# emulador ou com o GCP de verdade sao duas variaveis de ambiente - nao um if
# no codigo, nao uma camada de abstracao propria. Ver .env.example.
#
# Por que emulador e nao mock?
#   mock  -> testa o que VOCE IMAGINOU que a API faz
#   emulador -> testa contra uma implementacao real do contrato da API
# E' isso que faz a migracao para o GCP (Fase 9) ser um diff pequeno.

name: bikeflow

services:
  # -------------------------------------------------------------------------
  # Cloud Storage <- fake-gcs-server
  # Guarda a camada LANDING: zips originais das viagens + snapshots do GBFS.
  # -------------------------------------------------------------------------
  fake-gcs:
    image: fsouza/fake-gcs-server:1.55.1
    container_name: bikeflow-gcs
    command:
      - -scheme=http
      - -port=4443
      # -public-host precisa bater com o host que o CLIENTE usa, senao as URLs
      # de download que o servidor devolve apontam para um host inalcancavel.
      - -public-host=localhost:4443
      # backend=filesystem (nao memory): a landing precisa sobreviver a
      # restart do container. Baixar 1 GB de novo a cada 'docker compose up'
      # seria inaceitavel.
      - -backend=filesystem
      - -filesystem-root=/data
    ports:
      - "4443:4443"
    volumes:
      # Bind mount, nao volume nomeado: 'docker compose down -v' apaga volumes
      # nomeados mas NAO apaga bind mount. A landing sobrevive ao teardown.
      - ./.emulator/gcs:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Pub/Sub <- emulador OFICIAL do Google, dentro da imagem do gcloud CLI.
  # Recebe os eventos de status das estacoes vindos do poller GBFS.
  # -------------------------------------------------------------------------
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: bikeflow-pubsub
    command: >
      gcloud beta emulators pubsub start
      --project=bikeflow-local
      --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
# NOTA sobre persistencia do Pub/Sub: o emulador NAO persiste nada. Topicos,
# subscriptions e mensagens morrem junto com o container (documentado pelo
# Google). Consequencia de design: o bootstrap que cria topico/subscription
# precisa ser idempotente e roda a cada 'make up'. Isso e' bom - forca o mesmo
# padrao "create if not exists" que voce quer em producao.

  # -------------------------------------------------------------------------
  # Airflow (Fase 4) - fora do profile padrao de proposito: e' pesado
  # (Postgres proprio + init + webserver + scheduler) e nao deveria atrasar
  # o ciclo rapido de 'make up'/'make test-all' que so' precisa dos
  # emuladores. Suba com 'make airflow-up' (docker compose --profile airflow).
  # -------------------------------------------------------------------------
  postgres-airflow:
    image: postgres:16-alpine
    container_name: bikeflow-airflow-db
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./.emulator/airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Mailpit: servidor SMTP de teste local (Fase 4.4 - alertas em falha).
  # Mesmo principio dos outros emuladores - captura e-mail de verdade (com
  # API pra confirmar programaticamente) em vez de mockar "confiamos que o
  # Airflow chamou smtplib.sendmail()".
  # -------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: bikeflow-mailpit
    profiles: ["airflow"]
    ports:
      - "8025:8025" # UI web + API REST
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    container_name: bikeflow-airflow-init
    profiles: ["airflow"]
    # NAO usar user:${AIRFLOW_UID} aqui - tentei e quebrou getpwuid() do
    # Airflow (uid arbitrario sem entrada em /etc/passwd; a imagem oficial so'
    # resolve isso com um entrypoint proprio que nao copiei). Solucao mais
    # simples: manter o usuario 'airflow' padrao da imagem, e so' liberar
    # escrita em ./data (chmod no 'make airflow-up') - artefatos do dbt
    # (target/logs) vao para dentro do container, nao no bind mount de
    # ./transform (ver a task dbt na DAG).
    depends_on:
      postgres-airflow:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ""
      # Config do bikeflow: STORAGE_EMULATOR_HOST/PUBSUB_EMULATOR_HOST usam o
      # nome do SERVICO na rede do compose (fake-gcs/pubsub), nao 'localhost'
      # - de dentro do container, localhost e' o proprio container.
      GCP_PROJECT_ID: bikeflow-local
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
      PUBSUB_EMULATOR_HOST: pubsub:8085
      BIKEFLOW_BUCKET: bikeflow-lake
      BIKEFLOW_DUCKDB_PATH: /opt/bikeflow/data/bikeflow.duckdb
      # SMTP do Airflow -> Mailpit. Sem auth/TLS: e' um capturador local,
      # nao um servidor de email de verdade.
      AIRFLOW__SMTP__SMTP_HOST: mailpit
      AIRFLOW__SMTP__SMTP_PORT: "1025"
      AIRFLOW__SMTP__SMTP_STARTTLS: "False"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__SMTP__SMTP_MAIL_FROM: alerts@bikeflow.local
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin
        --firstname Admin --lastname User --role Admin --email admin@example.com
    volumes:
      - ./data:/opt/bikeflow/data

  airflow-webserver:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    container_name: bikeflow-airflow-webserver
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./data:/opt/bikeflow/data
      - ./transform:/opt/bikeflow/transform
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    container_name: bikeflow-airflow-scheduler
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./data:/opt/bikeflow/data
      - ./transform:/opt/bikeflow/transform
    restart: unless-stopped
