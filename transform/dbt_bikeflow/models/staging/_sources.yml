version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: trips
        description: >
          Carga 1:1 do CSV de viagens, sem regra de negocio. Escrita pelo job
          de ingestao (bikeflow.ingestion.trips.normalizer), nao pelo dbt.
      - name: station_information
        description: >
          Snapshot ATUAL (truncate + insert) do feed GBFS station_information.
          Escrita por bikeflow.ingestion.gbfs.snapshot, nao pelo dbt. O
          historico de mudancas (SCD2) e' construido pelo dbt snapshot
          station_snapshot, nao por esta tabela.
      - name: station_status
        description: >
          Leituras de status de estacao vindas do Pub/Sub, uma linha por
          mensagem consumida. Escrita por bikeflow.streaming.consumer, nao
          pelo dbt. Pode ter duplicatas (retry de mensagem/task) - dedupe
          acontece em stg_station_status.
        # So' faz sentido aqui (streaming, minutos) - nao em trips/
        # station_information (batch mensal/snapshot, "fresco" nao e' o
        # conceito certo pra essas fontes).
        loaded_at_field: _ingested_at
        freshness:
          warn_after: { count: 15, period: minute }
          error_after: { count: 60, period: minute }
